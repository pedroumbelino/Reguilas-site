<!doctype html>
<html lang="pt-PT" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="robots" content="{{robots}}">
  <link rel="canonical" href="{{url}}">
  <meta name="theme-color" content="#ec605f">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_PT">
  <meta property="og:site_name" content="Reguilas">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{url}}">
  <meta property="og:image" content="{{ogImage}}">
  <link rel="icon" type="image/png" href="/assets/img/favicon.png">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <link rel="preload" href="/assets/fonts/rubik-latin-900-italic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/quicksand-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/style.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "LocalBusiness",
    "name": "Reguilas",
    "description": "Animação infantil para casamentos, batizados, festas de aniversário e eventos corporativos.",
    "url": "{{siteUrl}}",
    "logo": "{{siteUrl}}/assets/img/logo.png",
    "image": "{{siteUrl}}/assets/img/hero-home.webp",
    "email": "reguilaseventos@gmail.com",
    "telephone": "+351910997292",
    "areaServed": "PT"
  }
  </script>
</head>
<body class="{{bodyClass}}">
  <a class="skip-link" href="#conteudo">Saltar para o conteúdo</a>
  {{>header}}
  <main id="conteudo">
{{content}}
  </main>
  <a class="btn floating-cta" href="/contactos#orcamento">Pedir orçamento!</a>
  {{>footer}}
  <script src="/assets/js/main.js" defer></script>
</body>
</html>
